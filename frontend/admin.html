<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin panel — Taklifnoma</title>
<link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2 3 7v5c0 5.2 3.8 8.7 9 10 5.2-1.3 9-4.8 9-10V7l-9-5Z" fill="var(--gold)"/><path d="M8 12.5l2.7 2.7L16.5 9" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-text">Taklifnoma</span>
    </a>
    <div class="nav-links">
      <a href="/dashboard">Mening panelim</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" data-theme-toggle aria-label="Mavzuni almashtirish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="nav-right" data-nav-auth style="gap:0.6rem;"></div>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="dash-head">
    <div>
      <h1 class="dash-title">Admin panel</h1>
      <p class="dash-count">Barcha foydalanuvchilar va taklifnomalarni shu yerdan boshqaring.</p>
    </div>
  </div>

  <div class="admin-stats" id="admin-stats"></div>

  <div class="admin-tabs">
    <button class="choice-pill active" data-tab="invitations">Barcha taklifnomalar</button>
    <button class="choice-pill" data-tab="users">Foydalanuvchilar</button>
    <button class="choice-pill" data-tab="messages">Xabarlar</button>
    <button class="choice-pill" data-tab="gallery">Galereya</button>
  </div>

  <div class="panel" id="tab-invitations">
    <div class="data-table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Egasi</th>
            <th>Ismlar</th>
            <th>Tadbir</th>
            <th>Sana</th>
            <th>Andoza</th>
            <th>Ko'rishlar</th>
            <th>Javoblar</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="invitations-body">
          <tr><td colspan="8" class="skeleton-loading">Yuklanmoqda...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="tab-users" hidden>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Ism</th>
            <th>Email</th>
            <th>Taklifnomalar</th>
            <th>Ro'yxatdan o'tgan</th>
            <th>Rol</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="users-body">
          <tr><td colspan="6" class="skeleton-loading">Yuklanmoqda...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="tab-messages" hidden>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Ism</th>
            <th>Aloqa</th>
            <th>Xabar</th>
            <th>Sana</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="messages-body">
          <tr><td colspan="5" class="skeleton-loading">Yuklanmoqda...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="panel panel-pad" id="tab-gallery" hidden>
    <div class="grid-2" style="max-width:560px;margin-bottom:1.6rem;">
      <div class="field">
        <label for="gallery_category">Bo'lim</label>
        <select id="gallery_category">
          <option value="toy">To'y</option>
          <option value="juftlik">Juftlik</option>
          <option value="oila">Oila</option>
        </select>
      </div>
      <div class="field">
        <label for="gallery_input">Rasm qo'shish</label>
        <input type="file" id="gallery_input" accept="image/png,image/jpeg,image/webp" />
        <p class="field-hint" id="gallery-upload-status"></p>
      </div>
    </div>

    <h3 class="dash-title" style="font-size:1.15rem;margin-bottom:0.8rem;">To'y</h3>
    <div class="gallery-admin-grid" id="gallery-admin-grid-toy" style="margin-bottom:2rem;"></div>

    <h3 class="dash-title" style="font-size:1.15rem;margin-bottom:0.8rem;">Juftlik</h3>
    <div class="gallery-admin-grid" id="gallery-admin-grid-juftlik" style="margin-bottom:2rem;"></div>

    <h3 class="dash-title" style="font-size:1.15rem;margin-bottom:0.8rem;">Oila</h3>
    <div class="gallery-admin-grid" id="gallery-admin-grid-oila"></div>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/categories.js"></script>
<script src="/assets/js/site.js"></script>
<script src="/assets/js/format.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>

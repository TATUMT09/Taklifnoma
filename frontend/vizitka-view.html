<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vizitka — Taklifnoma</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100%;
    background: linear-gradient(180deg, #F7F9FC, #EBF0F8);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #viz-root {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  #viz-card {
    width: 100%; max-width: 420px; background: #fff; border-radius: 22px;
    border: 1px solid rgba(13,27,61,0.08);
    box-shadow: 0 30px 70px -30px rgba(13,27,61,0.35);
    padding: 2.4rem 2rem; text-align: center;
  }
  #viz-icon {
    width: 76px; height: 76px; border-radius: 50%; background: #0D1B3D;
    display: flex; align-items: center; justify-content: center; font-size: 34px;
    margin: 0 auto 1.2rem;
  }
  #viz-heading {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: #0D1B3D; margin: 0 0 0.6rem;
  }
  #viz-sub { font-size: 0.92rem; color: #5B6472; margin: 0 0 1.6rem; line-height: 1.5; }
  #viz-name { font-size: 1.5rem; font-weight: 700; color: #0D1B3D; margin: 0 0 0.3rem; }
  #viz-phone-text { font-size: 1.2rem; font-weight: 600; color: #C8A75E; margin: 0 0 1.6rem; }
  #viz-note { font-size: 0.88rem; color: #5B6472; margin: 0 0 1.6rem; }
  #viz-call-btn {
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    width: 100%; padding: 1rem; border-radius: 999px; border: none;
    background: linear-gradient(135deg, #0D1B3D, #16265A); color: #fff;
    font-size: 1.05rem; font-weight: 700; text-decoration: none;
    box-shadow: 0 14px 30px -12px rgba(13,27,61,0.5);
  }
  #viz-call-btn svg { width: 20px; height: 20px; }
  #viz-error { color: #5B6472; text-align: center; padding: 2rem; }
</style>
</head>
<body>

<div id="viz-root">
  <div id="viz-card" hidden>
    <div id="viz-icon">🚗</div>
    <p id="viz-heading">Mashina egasiga xabar</p>
    <p id="viz-sub">Agar mashina yo'lingizni to'sib qo'ygan bo'lsa, quyidagi raqamga qo'ng'iroq qiling.</p>
    <p id="viz-name"></p>
    <p id="viz-phone-text"></p>
    <p id="viz-note" hidden></p>
    <a id="viz-call-btn" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span id="viz-call-label">Qo'ng'iroq qilish</span>
    </a>
  </div>
  <p id="viz-error" hidden>Bu vizitka topilmadi.</p>
</div>

<script>
(function () {
  const token = window.location.pathname.split('/').filter(Boolean).pop();
  const card = document.getElementById('viz-card');
  const errorEl = document.getElementById('viz-error');
  const nameEl = document.getElementById('viz-name');
  const phoneEl = document.getElementById('viz-phone-text');
  const noteEl = document.getElementById('viz-note');
  const callBtn = document.getElementById('viz-call-btn');
  const callLabel = document.getElementById('viz-call-label');

  fetch(`/api/vizitka/${token}`)
    .then((res) => { if (!res.ok) throw new Error('not found'); return res.json(); })
    .then((data) => {
      nameEl.textContent = data.name;
      phoneEl.textContent = data.phone;
      if (data.note) { noteEl.textContent = data.note; noteEl.hidden = false; }
      callBtn.href = `tel:${data.phone.replace(/\s+/g, '')}`;
      callLabel.textContent = `${data.name}ga qo'ng'iroq qilish`;
      card.hidden = false;
    })
    .catch(() => { errorEl.hidden = false; });
})();
</script>
</body>
</html>

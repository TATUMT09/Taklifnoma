<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none">
  <defs>
    <filter id="mflShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#5E2A2E" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="mflPeony" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F6D2CE"/>
      <stop offset="100%" stop-color="#E8A9A5"/>
    </radialGradient>
    <radialGradient id="mflPeonyDeep" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#EFB9B4"/>
      <stop offset="100%" stop-color="#DE9A96"/>
    </radialGradient>
    <radialGradient id="mflRose" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFCF6"/>
      <stop offset="100%" stop-color="#F7E8D0"/>
    </radialGradient>

    <g id="mfPeony">
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mflPeonyDeep)" transform="scale(30) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mflPeony)" transform="rotate(51) scale(30) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mflPeonyDeep)" transform="rotate(102) scale(30) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mflPeony)" transform="rotate(153) scale(30) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mflPeonyDeep)" transform="rotate(204) scale(30) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mflPeony)" transform="rotate(255) scale(30) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mflPeonyDeep)" transform="rotate(306) scale(30) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="0.62" ry="0.8" fill="url(#mflPeony)" transform="scale(19) translate(0,-0.75)"/>
      <ellipse cx="0" cy="-1" rx="0.62" ry="0.8" fill="url(#mflPeonyDeep)" transform="rotate(72) scale(19) translate(0,-0.75)"/>
      <ellipse cx="0" cy="-1" rx="0.62" ry="0.8" fill="url(#mflPeony)" transform="rotate(144) scale(19) translate(0,-0.75)"/>
      <ellipse cx="0" cy="-1" rx="0.62" ry="0.8" fill="url(#mflPeonyDeep)" transform="rotate(216) scale(19) translate(0,-0.75)"/>
      <ellipse cx="0" cy="-1" rx="0.62" ry="0.8" fill="url(#mflPeony)" transform="rotate(288) scale(19) translate(0,-0.75)"/>
      <circle r="7" fill="#CFA34A"/>
      <circle r="3.4" fill="#E6C978"/>
    </g>
    <g id="mfRose">
      <ellipse cx="0" cy="-1" rx="1" ry="1.22" fill="url(#mflRose)" transform="scale(21) translate(0,-0.85)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.22" fill="url(#mflRose)" transform="rotate(72) scale(21) translate(0,-0.85)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.22" fill="url(#mflRose)" transform="rotate(144) scale(21) translate(0,-0.85)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.22" fill="url(#mflRose)" transform="rotate(216) scale(21) translate(0,-0.85)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.22" fill="url(#mflRose)" transform="rotate(288) scale(21) translate(0,-0.85)"/>
      <circle r="6.4" fill="#CFA34A"/>
      <circle r="3" fill="#E6C978"/>
    </g>
    <g id="mfBud">
      <ellipse rx="9" ry="12" fill="url(#mflPeony)"/>
      <ellipse rx="9" ry="12" fill="url(#mflPeonyDeep)" transform="rotate(70)"/>
    </g>
    <g id="mfLeafGold">
      <path d="M0 0 C -20 -10, -32 3, -40 20 C -26 18, -10 10, 0 0 Z" fill="#CFA34A"/>
    </g>
    <g id="mfLeafOlive">
      <path d="M0 0 C 18 -9, 29 2, 36 18 C 23 16, 9 9, 0 0 Z" fill="#9C9B6B"/>
    </g>
  </defs>

  <path d="M60 40 C 90 110, 70 200, 110 280 C 130 320, 170 340, 200 350" stroke="#CFA34A" stroke-width="1.6" opacity="0.5" fill="none"/>

  <g filter="url(#mflShadow)">
    <use href="#mfLeafOlive" transform="translate(150,330) rotate(-16) scale(1.2)"/>
    <use href="#mfLeafGold" transform="translate(70,300) rotate(20) scale(1.3)"/>
    <use href="#mfLeafGold" transform="translate(210,300) rotate(-30) scale(1.1)"/>

    <use href="#mfPeony" transform="translate(110,270) scale(3.1)"/>

    <use href="#mfRose" transform="translate(215,235) scale(2.1)"/>
    <use href="#mfLeafOlive" transform="translate(250,200) rotate(30) scale(1.1)"/>

    <use href="#mfBud" transform="translate(60,180) rotate(-20) scale(1.05)"/>
    <use href="#mfLeafGold" transform="translate(40,140) rotate(10) scale(0.9)"/>

    <use href="#mfBud" transform="translate(255,130) rotate(25) scale(0.9)"/>
  </g>

  <circle cx="130" cy="230" r="3" fill="#CFA34A"/>
  <circle cx="200" cy="290" r="2.4" fill="#E6C978"/>
  <circle cx="90" cy="120" r="2.6" fill="#CFA34A"/>
</svg>

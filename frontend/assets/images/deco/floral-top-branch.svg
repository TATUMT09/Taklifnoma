<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" fill="none">
  <defs>
    <filter id="tSoftShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#0D1B3D" flood-opacity="0.25"/>
    </filter>
    <g id="tb-rose-navy">
      <ellipse cx="0" cy="-22" rx="15" ry="18" fill="#0B1730"/>
      <ellipse cx="18" cy="-10" rx="15" ry="18" fill="#16265A" transform="rotate(72 18 -10)"/>
      <ellipse cx="11" cy="15" rx="15" ry="18" fill="#0D1B3D" transform="rotate(144 11 15)"/>
      <ellipse cx="-11" cy="15" rx="15" ry="18" fill="#16265A" transform="rotate(216 -11 15)"/>
      <ellipse cx="-18" cy="-10" rx="15" ry="18" fill="#0B1730" transform="rotate(288 -18 -10)"/>
      <circle r="6.2" fill="#D4AF37"/>
      <circle r="2.4" fill="#F7E6B1"/>
    </g>
    <g id="tb-rose-white">
      <ellipse cx="0" cy="-18" rx="13" ry="15" fill="#EFE8DA"/>
      <ellipse cx="15" cy="-8" rx="13" ry="15" fill="#FFFFFF" transform="rotate(72 15 -8)"/>
      <ellipse cx="9" cy="13" rx="13" ry="15" fill="#F2ECE1" transform="rotate(144 9 13)"/>
      <ellipse cx="-9" cy="13" rx="13" ry="15" fill="#FFFFFF" transform="rotate(216 -9 13)"/>

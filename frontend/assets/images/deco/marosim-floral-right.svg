<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none">
  <defs>
    <filter id="mfrShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#5E2A2E" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="mfrCoral" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F5C4B8"/>
      <stop offset="100%" stop-color="#E8988A"/>
    </radialGradient>
    <radialGradient id="mfrCoralDeep" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#EEAA9C"/>
      <stop offset="100%" stop-color="#DD8A7D"/>
    </radialGradient>
    <radialGradient id="mfrRose" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFFCF6"/>
      <stop offset="100%" stop-color="#F7E8D0"/>
    </radialGradient>

    <g id="mrCoral">
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mfrCoralDeep)" transform="scale(29) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mfrCoral)" transform="rotate(51) scale(29) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mfrCoralDeep)" transform="rotate(102) scale(29) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mfrCoral)" transform="rotate(153) scale(29) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mfrCoralDeep)" transform="rotate(204) scale(29) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mfrCoral)" transform="rotate(255) scale(29) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.3" fill="url(#mfrCoralDeep)" transform="rotate(306) scale(29) translate(0,-0.8)"/>
      <ellipse cx="0" cy="-1" rx="0.6" ry="0.78" fill="url(#mfrCoral)" transform="scale(18) translate(0,-0.75)"/>
      <ellipse cx="0" cy="-1" rx="0.6" ry="0.78" fill="url(#mfrCoralDeep)" transform="rotate(72) scale(18) translate(0,-0.75)"/>
      <ellipse cx="0" cy="-1" rx="0.6" ry="0.78" fill="url(#mfrCoral)" transform="rotate(144) scale(18) translate(0,-0.75)"/>
      <ellipse cx="0" cy="-1" rx="0.6" ry="0.78" fill="url(#mfrCoralDeep)" transform="rotate(216) scale(18) translate(0,-0.75)"/>
      <ellipse cx="0" cy="-1" rx="0.6" ry="0.78" fill="url(#mfrCoral)" transform="rotate(288) scale(18) translate(0,-0.75)"/>
      <circle r="6.8" fill="#CFA34A"/>
      <circle r="3.2" fill="#E6C978"/>
    </g>
    <g id="mrRose">
      <ellipse cx="0" cy="-1" rx="1" ry="1.22" fill="url(#mfrRose)" transform="scale(19) translate(0,-0.85)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.22" fill="url(#mfrRose)" transform="rotate(72) scale(19) translate(0,-0.85)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.22" fill="url(#mfrRose)" transform="rotate(144) scale(19) translate(0,-0.85)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.22" fill="url(#mfrRose)" transform="rotate(216) scale(19) translate(0,-0.85)"/>
      <ellipse cx="0" cy="-1" rx="1" ry="1.22" fill="url(#mfrRose)" transform="rotate(288) scale(19) translate(0,-0.85)"/>
      <circle r="6" fill="#CFA34A"/>
      <circle r="2.8" fill="#E6C978"/>
    </g>
    <g id="mrBud">
      <ellipse rx="8" ry="11" fill="url(#mfrCoral)"/>
      <ellipse rx="8" ry="11" fill="url(#mfrCoralDeep)" transform="rotate(-65)"/>
    </g>
    <g id="mrLeafGold">
      <path d="M0 0 C 20 -10, 32 3, 40 20 C 26 18, 10 10, 0 0 Z" fill="#CFA34A"/>
    </g>
    <g id="mrLeafOlive">
      <path d="M0 0 C -18 -9, -29 2, -36 18 C -23 16, -9 9, 0 0 Z" fill="#9C9B6B"/>
    </g>
  </defs>

  <path d="M300 40 C 270 110, 290 200, 250 280 C 230 320, 190 340, 160 350" stroke="#CFA34A" stroke-width="1.6" opacity="0.5" fill="none"/>

  <g filter="url(#mfrShadow)">
    <use href="#mrLeafOlive" transform="translate(210,330) rotate(16) scale(1.2)"/>
    <use href="#mrLeafGold" transform="translate(290,300) rotate(-20) scale(1.3)"/>
    <use href="#mrLeafGold" transform="translate(150,300) rotate(30) scale(1.1)"/>

    <use href="#mrCoral" transform="translate(250,270) scale(3)"/>

    <use href="#mrRose" transform="translate(145,230) scale(2)"/>
    <use href="#mrLeafOlive" transform="translate(110,195) rotate(-30) scale(1.1)"/>

    <use href="#mrBud" transform="translate(300,180) rotate(20) scale(1.05)"/>
    <use href="#mrLeafGold" transform="translate(320,140) rotate(-10) scale(0.9)"/>

    <use href="#mrBud" transform="translate(105,130) rotate(-25) scale(0.9)"/>
  </g>

  <circle cx="230" cy="230" r="3" fill="#CFA34A"/>
  <circle cx="160" cy="290" r="2.4" fill="#E6C978"/>
  <circle cx="270" cy="120" r="2.6" fill="#CFA34A"/>
</svg>

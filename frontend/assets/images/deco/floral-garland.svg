    <use href="#leaf-pair" transform="translate(184,100) rotate(24) scale(1.15)"/>
    <use href="#rose-white" transform="translate(66,132) scale(1.25)"/>
    <use href="#leaf-pair" transform="translate(30,80) rotate(-30) scale(1.05)"/>

    <use href="#rose-white" transform="translate(150,224) scale(1.35)"/>
    <use href="#leaf-pair" transform="translate(88,188) rotate(-18) scale(1.1)"/>
    <use href="#rose-navy" transform="translate(56,282) scale(1.15)"/>

    <use href="#rose-navy" transform="translate(140,368) scale(1.45)"/>
    <use href="#leaf-pair" transform="translate(196,410) rotate(26) scale(1.15)"/>
    <use href="#rose-white" transform="translate(62,414) scale(1.3)"/>

    <use href="#rose-white" transform="translate(148,502) scale(1.3)"/>
    <use href="#leaf-pair" transform="translate(84,468) rotate(-20) scale(1.1)"/>
    <use href="#rose-navy" transform="translate(52,562) scale(1.2)"/>

    <use href="#rose-navy" transform="translate(136,638) scale(1.4)"/>
    <use href="#leaf-pair" transform="translate(190,680) rotate(20) scale(1.15)"/>
    <use href="#rose-white" transform="translate(60,684) scale(1.25)"/>

    <use href="#rose-white" transform="translate(144,772) scale(1.3)"/>
    <use href="#leaf-pair" transform="translate(82,744) rotate(-22) scale(1.05)"/>
    <use href="#rose-navy" transform="translate(50,830) scale(1.1)"/>

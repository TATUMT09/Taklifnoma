  <use href="#pearl" transform="translate(190,150)"/>
  <use href="#pearl" transform="translate(24,240)"/>
  <use href="#pearl" transform="translate(196,340)"/>
  <use href="#pearl" transform="translate(20,460)"/>
  <use href="#pearl" transform="translate(188,600)"/>
  <use href="#pearl" transform="translate(22,720)"/>
  <use href="#pearl" transform="translate(170,820)"/>

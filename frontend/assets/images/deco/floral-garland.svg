<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 900" fill="none">
  <path d="M130 4 C 105 130, 155 240, 115 350 C 85 460, 150 560, 120 670 C 95 770, 140 850, 120 896"
        stroke="#C8A75E" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <defs>
    <filter id="gSoftShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#0D1B3D" flood-opacity="0.28"/>
    </filter>

    <g id="rose-navy">
      <ellipse cx="0" cy="-28" rx="19" ry="23" fill="#0B1730"/>
      <ellipse cx="23" cy="-13" rx="19" ry="23" fill="#16265A" transform="rotate(72 23 -13)"/>
      <ellipse cx="14" cy="19" rx="19" ry="23" fill="#0D1B3D" transform="rotate(144 14 19)"/>
      <ellipse cx="-14" cy="19" rx="19" ry="23" fill="#16265A" transform="rotate(216 -14 19)"/>
      <ellipse cx="-23" cy="-13" rx="19" ry="23" fill="#0B1730" transform="rotate(288 -23 -13)"/>
      <ellipse cx="0" cy="-13" rx="11" ry="13" fill="#1B2C5F"/>
      <ellipse cx="10" cy="6" rx="11" ry="13" fill="#223873" transform="rotate(115 10 6)"/>
      <ellipse cx="-10" cy="6" rx="11" ry="13" fill="#1B2C5F" transform="rotate(245 -10 6)"/>
      <circle r="7.5" fill="#D4AF37"/>
      <circle r="3" fill="#F7E6B1"/>
    </g>
    <g id="rose-white">
      <ellipse cx="0" cy="-25" rx="18" ry="21" fill="#EFE8DA"/>
      <ellipse cx="21" cy="-11" rx="18" ry="21" fill="#FFFFFF" transform="rotate(72 21 -11)"/>
      <ellipse cx="13" cy="18" rx="18" ry="21" fill="#F2ECE1" transform="rotate(144 13 18)"/>
      <ellipse cx="-13" cy="18" rx="18" ry="21" fill="#FFFFFF" transform="rotate(216 -13 18)"/>
      <ellipse cx="-21" cy="-11" rx="18" ry="21" fill="#F2ECE1" transform="rotate(288 -21 -11)"/>
      <ellipse cx="0" cy="-11" rx="10" ry="12" fill="#FBF8F3"/>
      <ellipse cx="9" cy="5" rx="10" ry="12" fill="#FFFFFF" transform="rotate(115 9 5)"/>
      <ellipse cx="-9" cy="5" rx="10" ry="12" fill="#F5EFE4" transform="rotate(245 -9 5)"/>
      <circle r="7" fill="#D4AF37"/>
      <circle r="2.8" fill="#F7E6B1"/>
    </g>
    <g id="leaf-pair">

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rasm/Video uchun QR kod — Taklifnoma</title>
<link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2 3 7v5c0 5.2 3.8 8.7 9 10 5.2-1.3 9-4.8 9-10V7l-9-5Z" fill="var(--gold)"/><path d="M8 12.5l2.7 2.7L16.5 9" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-text">Taklifnoma</span>
    </a>
    <div class="nav-links"></div>
    <div class="nav-right">
      <button class="theme-toggle" data-theme-toggle aria-label="Mavzuni almashtirish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card panel panel-pad" id="qr-tool-card" style="max-width:440px;">
    <h1 class="auth-title">Rasm yoki videoni QR kodga aylantiring</h1>
    <p class="auth-sub">Faylni yuklang — QR kodni skanerlagan kishi to'g'ridan-to'g'ri o'sha rasm yoki videoni ko'radi.</p>

    <div class="field">
      <label for="qr-file-input">Rasm yoki video tanlang</label>
      <input type="file" id="qr-file-input" accept="image/png,image/jpeg,image/webp,video/mp4,video/webm" />
      <p class="field-hint" id="qr-status"></p>
    </div>

    <div id="qr-result" hidden style="margin-top:1.6rem;text-align:center;">
      <div id="qr-preview-wrap" style="margin-bottom:1.2rem;"></div>
      <div id="qr-canvas-wrap"></div>
      <p class="field-hint" id="qr-link" style="word-break:break-all;margin-top:0.8rem;"></p>
      <div style="display:flex;gap:0.6rem;justify-content:center;margin-top:1rem;flex-wrap:wrap;">
        <a href="#" download="qr-kod.png" class="btn btn-primary btn-sm" id="qr-download-btn">QR kodni yuklab olish</a>
        <button type="button" class="btn btn-outline btn-sm" id="qr-copy-link-btn">Havolani nusxalash</button>
      </div>
    </div>
  </div>
</div>

<script src="/assets/vendor/qrcode/qrcode.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/site.js"></script>
<script>
  const fileInput = document.getElementById('qr-file-input');
  const statusEl = document.getElementById('qr-status');
  const resultEl = document.getElementById('qr-result');
  const previewWrap = document.getElementById('qr-preview-wrap');
  const canvasWrap = document.getElementById('qr-canvas-wrap');
  const linkEl = document.getElementById('qr-link');
  const downloadBtn = document.getElementById('qr-download-btn');
  const copyBtn = document.getElementById('qr-copy-link-btn');

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand('copy'); showToast('Havola nusxalandi'); }
    catch (e) { showToast("Nusxalab bo'lmadi", true); }
    document.body.removeChild(ta);
  }

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    resultEl.hidden = true;
    statusEl.textContent = 'Yuklanmoqda...';
    try {
      const isVideo = file.type.startsWith('video/');
      const { url } = isVideo ? await api.uploadVideo(file) : await api.uploadPhoto(file);
      const fullUrl = window.location.origin + url;

      previewWrap.innerHTML = isVideo
        ? `<video src="${url}" controls style="max-width:100%;max-height:220px;border-radius:12px;"></video>`
        : `<img src="${url}" alt="" style="max-width:100%;max-height:220px;border-radius:12px;object-fit:contain;" />`;

      const qr = qrcode(0, 'M');
      qr.addData(fullUrl);
      qr.make();
      const dataUrl = qr.createDataURL(8, 8);
      canvasWrap.innerHTML = `<img src="${dataUrl}" alt="QR kod" style="width:220px;height:220px;" />`;
      downloadBtn.href = dataUrl;
      linkEl.textContent = fullUrl;

      statusEl.textContent = '';
      resultEl.hidden = false;

      copyBtn.onclick = () => {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(fullUrl).then(() => showToast('Havola nusxalandi'), () => fallbackCopy(fullUrl));
        } else {
          fallbackCopy(fullUrl);
        }
      };
    } catch (err) {
      statusEl.textContent = err.message;
    }
  });
</script>
</body>
</html>

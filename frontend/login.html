<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kirish — Taklifnoma</title>
<link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2 3 7v5c0 5.2 3.8 8.7 9 10 5.2-1.3 9-4.8 9-10V7l-9-5Z" fill="var(--gold)"/><path d="M8 12.5l2.7 2.7L16.5 9" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Taklifnoma
    </a>
    <div class="nav-links"></div>
    <div class="nav-right">
      <button class="theme-toggle" data-theme-toggle aria-label="Mavzuni almashtirish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card panel panel-pad">
    <h1 class="auth-title">Xush kelibsiz</h1>
    <p class="auth-sub">Taklifnomalaringizni boshqarish uchun kiring.</p>
    <form class="auth-form" id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="siz@misol.uz" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Parol</label>
        <input id="password" name="password" type="password" placeholder="Parolingiz" autocomplete="current-password" required />
      </div>
      <p class="field-error" id="form-error"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Kirish</button>
    </form>
    <p class="auth-switch">Akkauntingiz yo'qmi? <a href="/register">Ro'yxatdan o'tish</a></p>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/site.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('form-error');
    const btn = document.getElementById('submit-btn');
    errEl.textContent = '';
    const payload = {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    };
    btn.disabled = true;
    btn.textContent = 'Tekshirilmoqda...';
    try {
      await api.login(payload);
      const slug = await resumePendingInvitation();
      window.location.href = slug ? `/dashboard?created=${slug}` : '/dashboard';
    } catch (err) {
      errEl.textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Kirish';
    }
  });
</script>
</body>
</html>

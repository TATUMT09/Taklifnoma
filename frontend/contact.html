<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Adminga yozish — Taklifnoma</title>
<link rel="stylesheet" href="/assets/css/site.css" />
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2 3 7v5c0 5.2 3.8 8.7 9 10 5.2-1.3 9-4.8 9-10V7l-9-5Z" fill="var(--gold)"/><path d="M8 12.5l2.7 2.7L16.5 9" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-text">Taklifnoma</span>
    </a>
    <div class="nav-links"></div>
    <div class="nav-right">
      <button class="theme-toggle" data-theme-toggle aria-label="Mavzuni almashtirish">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card panel panel-pad" id="contact-card">
    <h1 class="auth-title">Adminga yozish</h1>
    <p class="auth-sub">Savolingiz yoki takliflaringiz bo'lsa, shu yerdan yozing — imkon qadar tez javob beramiz.</p>
    <form class="auth-form" id="contact-form">
      <div class="field">
        <label for="contact-name">Ismingiz (ixtiyoriy)</label>
        <input id="contact-name" type="text" maxlength="120" />
      </div>
      <div class="field">
        <label for="contact-contact">Aloqa uchun (telefon/telegram, ixtiyoriy)</label>
        <input id="contact-contact" type="text" maxlength="120" />
      </div>
      <div class="field">
        <label for="contact-message">Xabaringiz</label>
        <textarea id="contact-message" required maxlength="2000" style="min-height:110px;"></textarea>
      </div>
      <p class="field-error" id="form-error"></p>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Yuborish</button>
    </form>
  </div>
</div>

<script src="/assets/js/api.js"></script>
<script src="/assets/js/site.js"></script>
<script>
  document.getElementById('contact-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('form-error');
    const btn = document.getElementById('submit-btn');
    errEl.textContent = '';
    const payload = {
      name: document.getElementById('contact-name').value,
      contact: document.getElementById('contact-contact').value,
      message: document.getElementById('contact-message').value
    };
    btn.disabled = true;
    btn.textContent = 'Yuborilmoqda...';
    try {
      await api.sendContactMessage(payload);
      document.getElementById('contact-card').innerHTML = `
        <h1 class="auth-title">Rahmat!</h1>
        <p class="auth-sub">Xabaringiz yuborildi. Tez orada bog'lanamiz.</p>
        <a href="/" class="btn btn-outline btn-block">Bosh sahifaga qaytish</a>
      `;
    } catch (err) {
      errEl.textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Yuborish';
    }
  });
</script>
</body>
</html>
